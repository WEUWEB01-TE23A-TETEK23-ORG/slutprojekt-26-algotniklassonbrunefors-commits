<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ant Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <header>
            <h1>Ant Clicker</h1>
            <p id="myror"></p>
            <p id="resurser"></p>
            <p id="vinst"></p>
        </header>
        <div class="kontainer">
            <main>
                <img src="./bilder/anthill-section-under-ground-termite-260nw-2171588899.png" onclick="clickBarr()" id="myrstack" alt="Myrstack">
                <div id="krigBox" style="visibility: hidden">
                    <p id="krigTxt">Du stöter på en fientlig myrstack! Vad vill du göra?</p>
                    <button id="krigBtn" onclick="kriga()">Kriga! (Vinst: Dubbla dina barr. Förlust: Förlora alla dina barr och myror.)</button>
                    <button id="retireraBtn" onclick="retirera()">Retirera! (Förlora häften av dina barr.)</button>
                    <img src="./bilder/static.gif" id="krigBild" style="visibility: hidden" alt="static GIF">
                </div>
            </main>
            <div class="sidebar">
                <h2>Upgraderingar</h2>
                <button id="myraBtn" onclick="buy_myra()">Köp myra (10 barr)</button>
                <button id="autoBtn" onclick="auto_samla()">Auto samla (100 barr)</button>
                <button id="matBtn" onclick="auto_mat()">Mat insamling (1000 barr)</button>
                <button id="drottningBtn" onclick="auto_myra()">Köp drottning (5000 barr)</button>
                <button id="soldatBtn" onclick="soldat_myra()">Köp soldatmyra (10000 barr)</button>
            </div>
        </div>
        <footer>
            <button onclick="location.href='meny.html'">Huvudmeny</button>
            <button onclick="location.href='instruktioner.html'">Spel instruktioner</button>
        </footer>

    <script src="script.js"></script>
</body>
</html>
